<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta property="og:title" content="{% block og_title %}{{ title }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Chahana Reddy's portfolio{% endblock %}">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./static/styles/main.css">
    <link rel="icon" href="./static/img/favicon.ico" type="image/x-icon">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    {% block extra_head %}{% endblock %}
</head>

<body>
    <div class="forest-bg" aria-hidden="true">
        <div class="forest-glow forest-glow--one"></div>
        <div class="forest-glow forest-glow--two"></div>
    </div>

    {% include 'menu.html' %}

    {% block content %}{% endblock %}

    <footer class="site-footer">
        <p>Chahana Reddy &middot; Built with Flask</p>
    </footer>

    <script src="./static/js/main.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
